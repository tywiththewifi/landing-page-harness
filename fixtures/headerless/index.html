<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brightcast | Grow your channel faster</title>
  <style>
    body { margin: 0; background: #0b0d14; color: #fff; font-family: system-ui, sans-serif; }
    main { padding: 32px 20px; }
    section { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 32px; }
    h1 { font-size: 56px; margin: 0; }
    p { color: #b8bccb; max-width: 640px; }
    .cta { background: #2f6bff; color: #fff; padding: 16px 28px; border-radius: 999px; text-decoration: none; }
    .help { position: absolute; top: 24px; right: 24px; width: 24px; height: 24px; }
  </style>
</head>
<body>
  <!-- A paid-ad landing page: no header or nav, just the logo (not a link) above the hero. -->
  <main>
    <svg class="help" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#555" /></svg>
    <section>
      <img alt="Brightcast Logo" width="108" height="36" src="logo.svg" />
      <h1>Grow your channel faster</h1>
      <p>Find proven keywords, generate ideas and optimise every video for more views.</p>
      <a class="cta" href="https://example.com/signup">Start growing today</a>
    </section>
  </main>
</body>
</html>
