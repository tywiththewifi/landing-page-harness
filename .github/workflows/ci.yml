name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the extractor tests
        run: pnpm --filter @lph/extractor exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - name: Upload new or changed visual-regression shots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: helm-study-screenshots
          path: packages/helm-study/test/__screenshots__/
          if-no-files-found: ignore
      - name: Ad check evals
        run: pnpm --silent --filter @lph/ads evals >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm --filter @lph/studio build
      - run: pnpm --filter @lph/studio build:demo
