name: Demo

# Publishes the in-browser demo (apps/studio, `build:demo`) to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions". Once the import service is set
# up on Cloud Run (import-service.yml), the demo imports any site through it; an
# IMPORT_API variable points it at a service hosted elsewhere.
on:
  push:
    branches: [main]
  # A new deploy of the service can be its first, so the demo is rebuilt to find it.
  workflow_run:
    workflows: [Import service]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for the import service
        id: service
        env:
          IMPORT_API: ${{ vars.IMPORT_API }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$IMPORT_API" ]; then echo "VITE_IMPORT_API=$IMPORT_API" >> "$GITHUB_ENV"
          elif [ -n "$SERVICE_ACCOUNT" ]; then
            echo "project=$(echo "$SERVICE_ACCOUNT" | sed -E 's/.*@([^.]+)\.iam\.gserviceaccount\.com$/\1/')" >> "$GITHUB_OUTPUT"
          else echo "No import service, so imports replay the sample."; fi
      - uses: google-github-actions/auth@v2
        if: steps.service.outputs.project
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ steps.service.outputs.project }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.service.outputs.project
      - name: Find it on Cloud Run
        if: steps.service.outputs.project
        run: |
          URL=$(gcloud run services describe lph-import --region europe-west1 --format 'value(status.url)' 2> /dev/null || true)
          echo "Import service: ${URL:-not deployed yet, so imports replay the sample}"
          echo "VITE_IMPORT_API=$URL" >> "$GITHUB_ENV"
      - run: pnpm --filter @lph/studio build:demo
      - run: cp apps/studio/dist-demo/demo.html apps/studio/dist-demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio/dist-demo
      - id: deploy
        uses: actions/deploy-pages@v4
