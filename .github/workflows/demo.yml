name: Demo

# Publishes the in-browser demo (apps/studio, `build:demo`) to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions". With an HF_TOKEN secret, the
# demo imports any site through the import service (import-service.yml); an IMPORT_API
# variable points it at a service hosted elsewhere.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find the import service
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMPORT_API: ${{ vars.IMPORT_API }}
        run: |
          if [ -z "$IMPORT_API" ] && [ -n "$HF_TOKEN" ]; then
            pip install --quiet huggingface_hub
            IMPORT_API=$(python scripts/hf-space.py url)
          fi
          echo "Import service: ${IMPORT_API:-none, so imports replay the sample}"
          echo "VITE_IMPORT_API=$IMPORT_API" >> "$GITHUB_ENV"
      - run: pnpm --filter @lph/studio build:demo
      - run: cp apps/studio/dist-demo/demo.html apps/studio/dist-demo/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio/dist-demo
      - id: deploy
        uses: actions/deploy-pages@v4
